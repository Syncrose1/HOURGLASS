name: CI

# Pull requests cover the work in progress; pushes cover main after a merge.
# Listening to both for every branch would run each commit twice.
on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever was still running for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # AGP 8.2 needs 17, and the runner defaults to a newer JDK.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Compilation is the headline question, so it runs first and on its own:
      # a red X here means the code does not build, with nothing else to read past.
      - name: Assemble debug
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      # lint has abortOnError on, so this gate is real rather than advisory.
      - name: Lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      # Without these a red run can only be diagnosed by reproducing it locally,
      # which is the whole thing CI is supposed to save.
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  wrapper:
    name: Validate the Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Deliberately a separate job rather than a step in `build`. The wrapper jar is a
    # binary committed to the repo and worth checking against Gradle's published
    # checksums, but that check must never be able to mask the build result.
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate
        uses: gradle/actions/wrapper-validation@v4
