name: Release

# A version tag builds, checks and publishes: `git tag v1.2.3 && git push origin v1.2.3`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The same gate as CI: nothing is published that does not build and pass.
      - name: Build, test and lint
        run: ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug

      # There is no release signing key yet, so the installable build is the
      # debug-signed one. It installs alongside a release build (".debug" id).
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "hourglass-${GITHUB_REF_NAME}.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "hourglass-${GITHUB_REF_NAME}.apk" \
            --title "HOURGLASS $GITHUB_REF_NAME" \
            --generate-notes
